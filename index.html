<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Details Form</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  form {
    background: #fff;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 1.5rem;
    text-align: center;
    color: #222;
  }
  label {
    display: block;
    margin-bottom: 0.3rem;
    font-weight: bold;
    color: #333;
  }
  input {
    width: 100%;
    padding: 0.5rem;
    margin-bottom: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 0.7rem;
    background: #2d6cdf;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover {
    background: #1f54b5;
  }
  #result {
    margin-top: 1rem;
    text-align: center;
    color: #2d6cdf;
    font-weight: bold;
  }
  #entries {
    background: #fff;
    padding: 1.5rem 2rem;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
    margin-top: 1.5rem;
  }
  #entries h2 {
    font-size: 1.1rem;
    margin: 0 0 0.75rem;
    color: #222;
  }
  #entries ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #entries li {
    padding: 0.6rem 0;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
    color: #444;
  }
  #entries li:last-child {
    border-bottom: none;
  }
  #entries li strong {
    color: #222;
  }
  #entries p {
    color: #888;
    font-size: 0.9rem;
    margin: 0;
  }
</style>
</head>
<body>

<div>
<form id="userForm">
  <h1>User Information</h1>

  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="number">Phone Number</label>
  <input type="tel" id="number" name="number" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="dob">Date of Birth</label>
  <input type="date" id="dob" name="dob" required>

  <button type="submit">Submit</button>

  <div id="result"></div>
</form>

<div id="entries">
  <h2>Saved Submissions (this browser)</h2>
  <ul id="entriesList"></ul>
  <p style="margin-top: 0.75rem;"><a href="submissions.html">View all submissions &rarr;</a></p>
</div>
</div>

<script>
  const STORAGE_KEY = 'userFormSubmissions';

  function loadSubmissions() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function renderSubmissions() {
    const list = document.getElementById('entriesList');
    const submissions = loadSubmissions();
    list.innerHTML = '';

    if (submissions.length === 0) {
      list.innerHTML = '<p>No submissions saved yet.</p>';
      return;
    }

    submissions.slice().reverse().forEach((entry) => {
      const li = document.createElement('li');

      const strong = document.createElement('strong');
      strong.textContent = entry.name;
      li.appendChild(strong);
      li.appendChild(document.createElement('br'));
      li.appendChild(document.createTextNode(`${entry.number} · ${entry.email} · DOB: ${entry.dob}`));

      list.appendChild(li);
    });
  }

  document.getElementById('userForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const number = document.getElementById('number').value;
    const email = document.getElementById('email').value;
    const dob = document.getElementById('dob').value;

    const submissions = loadSubmissions();
    submissions.push({ name, number, email, dob });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(submissions));

    document.getElementById('result').textContent =
      `Thanks, ${name}! Received: ${number}, ${email}, DOB: ${dob}`;

    e.target.reset();
    renderSubmissions();
  });

  renderSubmissions();
</script>

</body>
</html>
